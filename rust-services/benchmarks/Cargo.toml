[package]
name = "benchmarks"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "benchmark-validator"
path = "src/validator.rs"

[[bin]]
name = "benchmark-compare"
path = "src/compare.rs"

[dependencies]
common = { path = "../common" }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
criterion = "0.5"
rand = "0.8"
indicatif = "0.17"
tabled = "0.17"

[[bench]]
name = "validation"
harness = false
