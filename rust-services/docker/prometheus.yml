# Prometheus configuration for Penpot Rust Services

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:8080']
    metrics_path: /metrics

  - job_name: 'shape-validator'
    static_configs:
      - targets: ['shape-validator:8081']
    metrics_path: /metrics

  - job_name: 'realtime-sync'
    static_configs:
      - targets: ['realtime-sync:8082']
    metrics_path: /metrics

  - job_name: 'render-service'
    static_configs:
      - targets: ['render-service:8083']
    metrics_path: /metrics
